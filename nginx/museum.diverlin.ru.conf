# ==============================================================================
# Nginx Configuration for museum.diverlin.ru
# VDS Ubuntu / Node.js Reverse Proxy (Port 3017) + Static SPA
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name museum.diverlin.ru;

    # Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP requests to HTTPS (раскомментировать после получения SSL сертификата)
    # return 301 https://$host$request_uri;

    # До настройки SSL отдаем сайт и API напрямую:
    root /var/www/museum.diverlin.ru/dist;
    index index.html;

    client_max_body_size 20M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # 1. API & Swagger Reverse Proxy to Node.js (PM2 on port 3017)
    location /api/ {
        proxy_pass http://127.0.0.1:3017;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # 2. Static Assets Caching (Vite bundle assets)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # 3. SPA Route Fallback (React Router / Browser Navigation)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

